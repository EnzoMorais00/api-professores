services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: professores_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d professores_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/professores_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: demo
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
